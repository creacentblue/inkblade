<script>
'use strict';
/* ============================================================
   墨雨孤刃 · Ink & Rain — an original ink-wash wuxia side-scroller
   Single file, no external assets. All art is procedural canvas.
   ============================================================ */
const W=1280,H=720,TAU=Math.PI*2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
document.getElementById('nojs').style.display='none';
let VS=1,VX=0,VY=0;
let TOUCH=!!((window.matchMedia&&matchMedia('(pointer:coarse)').matches)||/[?&]touch=1/.test(location.search));
document.body.classList.toggle('touch',TOUCH);
const TT=(a,b)=>TOUCH?b:a;
function resize(){const d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.floor(innerWidth*d);cv.height=Math.floor(innerHeight*d);cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';VS=Math.min(cv.width/W,cv.height/H);VX=(cv.width-W*VS)/2;VY=(cv.height-H*VS)/2;if(TOUCH&&innerHeight>innerWidth)VY=Math.min(VY,40*d)}
addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rand=(a,b)=>a+Math.random()*(b-a),ease=t=>t*t*(3-2*t);
const sgn=v=>v<0?-1:1;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const SERIF='"Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","SimSun","Noto Serif SC",serif';
const KAI='"STKaiti","KaiTi","Kaiti SC","AR PL UKai CN","Noto Serif CJK SC","Songti SC",serif';

/* ---------------- audio (procedural) ---------------- */
const AU={c:null,m:null,muted:false,rain:null,started:false,nextNote:0,boss:false,
 init(){if(this.c)return;try{const C=window.AudioContext||window.webkitAudioContext;this.c=new C();this.m=this.c.createGain();this.m.gain.value=this.muted?0:.8;this.m.connect(this.c.destination);
   this.verb=this.c.createDelay(1);this.verb.delayTime.value=.27;const fb=this.c.createGain();fb.gain.value=.38;this.verb.connect(fb);fb.connect(this.verb);const vg=this.c.createGain();vg.gain.value=.5;this.verb.connect(vg);vg.connect(this.m);
   // rain bed
   const len=this.c.sampleRate*2,b=this.c.createBuffer(1,len,this.c.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.nbuf=b;
   const s=this.c.createBufferSource();s.buffer=b;s.loop=true;const hp=this.c.createBiquadFilter();hp.type='highpass';hp.frequency.value=900;const lp=this.c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6500;const g=this.c.createGain();g.gain.value=.06;s.connect(hp);hp.connect(lp);lp.connect(g);g.connect(this.m);s.start();this.rainG=g;
   this.started=true}catch(e){this.c=null}},
 setMute(v){this.muted=v;if(this.m)this.m.gain.value=v?0:.8},
 tone(f,dur,vol,type,slide,send){if(!this.c)return;const t=this.c.currentTime,o=this.c.createOscillator(),g=this.c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(this.m);if(send)g.connect(this.verb);o.start(t);o.stop(t+dur+.02)},
 noise(dur,vol,type,f0,f1,q){if(!this.c)return;const t=this.c.currentTime,s=this.c.createBufferSource();s.buffer=this.nbuf;const f=this.c.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);f.Q.value=q||1;const g=this.c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(this.m);s.start(t,Math.random(),dur+.05)},
 slash(h){this.noise(h?.28:.16,h?.5:.32,'bandpass',h?500:900,h?2400:3600,1.2)},
 clang(p){this.noise(.12,.5,'highpass',2500,0,1);this.tone(p?2200:1500,p?.7:.35,.22,'triangle',0,1);this.tone(p?3300:2300,p?.9:.4,.13,'sine',0,1);if(p)this.tone(880,.5,.1,'sine',0,1)},
 hit(h){this.noise(.18,.55,'lowpass',h?900:600,120,1);this.tone(h?90:130,.2,.5,'sine',40)},
 dodge(){this.noise(.22,.3,'highpass',1200,5000,.8)},
 jump(d){this.tone(d?420:300,.15,.12,'triangle',d?760:520)},
 land(){this.noise(.08,.18,'lowpass',500,200,1)},
 boom(){this.tone(60,.9,.7,'sine',22);this.noise(.7,.5,'lowpass',400,60,1)},
 thunder(){this.noise(1.6,.6,'lowpass',260,50,.7);this.tone(46,1.4,.4,'sine',28)},
 heal(){[523,659,784].forEach((f,i)=>setTimeout(()=>this.tone(f,.5,.14,'triangle',0,1),i*90))},
 pluck(f,v){this.tone(f,1.1,v||.1,'triangle',f*.995,1);this.tone(f*2,.5,(v||.1)*.3,'sine',0,1)},
 gong(){this.tone(110,2.2,.35,'sine',100,1);this.tone(165,1.8,.2,'triangle',0,1);this.noise(.2,.25,'bandpass',1200,800,2)},
 tick(dt){ // ambient guzheng-ish phrases
  if(!this.c||this.muted)return;const t=this.c.currentTime;if(t<this.nextNote)return;
  const sc=this.boss?[146.8,174.6,196,220,261.6,293.7]:[146.8,164.8,196,220,246.9,293.7,329.6,392];
  const f=sc[Math.floor(Math.random()*sc.length)];this.pluck(f,this.boss?.12:.08);
  if(this.boss){this.tone(55,.35,.5,'sine',40);}
  this.nextNote=t+(this.boss?rand(.5,.9):rand(.9,2.4));}
};
/* ---------------- input ---------------- */
const BIND={left:['ArrowLeft','KeyA'],right:['ArrowRight','KeyD'],up:['ArrowUp','KeyW'],down:['ArrowDown','KeyS'],jump:['Space','ArrowUp','KeyW'],atk:['KeyJ'],heavy:['KeyI'],parry:['KeyK'],dodge:['KeyL'],heal:['KeyQ'],ok:['Enter']};
const keys={},press={};
const down=a=>BIND[a].some(k=>keys[k]);
function consume(a,win){const t=press[a];if(t&&performance.now()-t<(win||.14)*1000){press[a]=0;return true}return false}
function anyKeyAction(code){for(const a in BIND)if(BIND[a].includes(code))press[a]=performance.now()}
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code))e.preventDefault();
  if(e.repeat)return;keys[e.code]=true;anyKeyAction(e.code);AU.init();
  if(AU.c&&AU.c.state==='suspended')AU.c.resume();
  if(e.code==='KeyM'){AU.setMute(!AU.muted)}
  if(e.code==='KeyP'||e.code==='Escape')togglePause();
  if(e.code==='KeyF'){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();else document.exitFullscreen()}
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(G&&G.mode==='play')togglePause(true)});
cv.addEventListener('pointerdown',()=>{cv.focus();AU.init();if(G.mode==='title'||G.mode==='story'){press.ok=performance.now()}});

/* ---------------- level ---------------- */
const PL=[
 {x:-120,y:560,w:1420,h:900,kind:'roof'},
 {x:520,y:452,w:180,h:14,kind:'awn'},
 {x:1480,y:520,w:700,h:900,kind:'roof'},
 {x:1700,y:412,w:170,h:14,kind:'awn'},
 {x:2400,y:580,w:500,h:900,kind:'roof'},
 {x:2860,y:478,w:92,h:14,kind:'awn'},
 {x:3000,y:380,w:62,h:900,kind:'pillar'},
 {x:3150,y:540,w:1000,h:900,kind:'roof'},
 {x:3590,y:430,w:210,h:14,kind:'awn'},
 {x:3900,y:430,w:150,h:14,kind:'awn'},
 {x:4215,y:530,w:110,h:14,kind:'awn'},
 {x:4400,y:500,w:480,h:900,kind:'roof'},
 {x:4880,y:560,w:1500,h:900,kind:'roof'}
];
const LEVEL_END=6380,ARENA_L=4975,ARENA_R=6345,BOSS_TRIGGER=5170,GATE_X=6270,BOSS_X=5960;
const CPS=[{x:90,y:560},{x:2460,y:580},{x:3220,y:540},{x:4440,y:500},{x:4950,y:560}];
const SPAWNS=[['grunt',880],['grunt',1760],['grunt',2040],['spear',2660],['grunt',3390],['shield',3660],['spear',3960],['grunt',4030],['shield',4640],['grunt',4780]];
const HINTS=[
 {x:60,t:'← → / A D 移动　Space 跳跃（空中再按二段跳，长按滑翔）',t2:'摇杆左右移动　「跳」跳跃（空中再点二段跳，长按滑翔）',id:'h0'},
 {x:420,t:'J 出剑　连按三下成连招　　L 闪避（短暂无敌）',t2:'「攻」出剑　连点三下成连招　　「闪」闪避（短暂无敌）',id:'h1'},
 {x:1320,t:'贴墙时按住方向可滑墙，Space 蹬墙跳　　Space 长按可滑翔过沟',t2:'贴墙时朝墙推摇杆可滑墙，「跳」蹬墙跳　　「跳」长按可滑翔过沟',id:'h2'},
 {x:1700,t:'K 在敌人出招瞬间按下 = 精准格挡 → 慢动作 → 立刻按 J 反击',t2:'「挡」在敌人出招瞬间点按 = 精准格挡 → 慢动作 → 立刻点「攻」反击',id:'h3'},
 {x:2480,t:'红光＝不可格挡的杀招，用 L 闪避或跳起躲开　　Q 饮药',t2:'红光＝不可格挡的杀招，用「闪」闪避或跳起躲开　　「药」饮药',id:'h4'},
 {x:3070,t:'I 重击（按住蓄力）可破盾卫架势　势条满则失衡，近身按 J 处决',t2:'「重」重击（按住蓄力）可破盾卫架势　势条满则失衡，近身点「攻」处决',id:'h5'},
 {x:4420,t:'前方灯笼可点亮存档。观雨楼就在前面——送信，闯过守楼人。',id:'h6'}
];
function platAt(x,y,tol){for(const p of PL){if(p.kind==='awn')continue;if(x>=p.x&&x<=p.x+p.w&&Math.abs(p.y-y)<(tol||8))return p}return null}
/* ---------------- procedural backdrop ---------------- */
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
const BG={};
function pagoda(c,x,base,w,floors,col){ // layered eaves silhouette
  c.fillStyle=col;let cw=w,y=base;
  c.fillRect(x-cw*.32,y-floors*w*.42-8,cw*.64,floors*w*.42+8);
  for(let i=0;i<floors;i++){const ww=cw*(1-i*.14),yy=y-i*w*.42;
    c.beginPath();c.moveTo(x-ww*.78,yy-w*.1);c.quadraticCurveTo(x-ww*.45,yy-w*.02,x-ww*.18,yy-w*.3);c.lineTo(x+ww*.18,yy-w*.3);c.quadraticCurveTo(x+ww*.45,yy-w*.02,x+ww*.78,yy-w*.1);c.quadraticCurveTo(x+ww*.5,yy+w*.04,x,yy+w*.04);c.quadraticCurveTo(x-ww*.5,yy+w*.04,x-ww*.78,yy-w*.1);c.fill();}
  const top=y-floors*w*.42;c.fillRect(x-1.5,top-w*.55,3,w*.5);
}
function house(c,x,base,w,h,col){c.fillStyle=col;c.fillRect(x-w*.4,base-h,w*.8,h);
  c.beginPath();c.moveTo(x-w*.62,base-h+8);c.quadraticCurveTo(x-w*.3,base-h+2,x-w*.12,base-h-h*.5);c.lineTo(x+w*.12,base-h-h*.5);c.quadraticCurveTo(x+w*.3,base-h+2,x+w*.62,base-h+8);c.quadraticCurveTo(x,base-h+22,x-w*.62,base-h+8);c.fill();}
function buildBG(){
  // sky
  const sky=mk(W,H),c=sky.getContext('2d');
  let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#050506');g.addColorStop(.45,'#1d1e20');g.addColorStop(.72,'#6b6d6c');g.addColorStop(.86,'#3a3b3c');g.addColorStop(1,'#0e0e10');c.fillStyle=g;c.fillRect(0,0,W,H);
  g=c.createRadialGradient(930,190,10,930,190,380);g.addColorStop(0,'rgba(190,20,25,.55)');g.addColorStop(.25,'rgba(120,14,18,.25)');g.addColorStop(1,'rgba(120,14,18,0)');c.fillStyle=g;c.fillRect(0,0,W,H);
  c.fillStyle='#a8171c';c.beginPath();c.arc(930,190,74,0,TAU);c.fill();
  g=c.createRadialGradient(915,175,5,930,190,76);g.addColorStop(0,'rgba(255,120,110,.35)');g.addColorStop(1,'rgba(60,0,0,.35)');c.fillStyle=g;c.beginPath();c.arc(930,190,74,0,TAU);c.fill();
  // ink-wash cloud streaks
  const r=mulberry(7);c.filter='blur(14px)';for(let i=0;i<14;i++){const y=60+r()*380,x=r()*W,w=260+r()*520;c.fillStyle='rgba('+(r()<.5?'8,8,9':'95,96,96')+','+(.18+r()*.2)+')';c.beginPath();c.ellipse(x,y,w,10+r()*22,0,0,TAU);c.fill()}c.filter='none';
  BG.sky=sky;
  // parallax strips (seamless period)
  const P=2400;
  function strip(col,fn,blur){const s=mk(P,H),c=s.getContext('2d');if(blur)c.filter='blur('+blur+'px)';c.fillStyle=col;fn(c);c.filter='none';return s}
  const rr=mulberry(11);
  BG.far=strip('#4c4d4e',c=>{c.beginPath();c.moveTo(0,H);for(let x=0;x<=P;x+=20){const a=x/P*TAU;const y=470-70*Math.sin(a*3+1)-45*Math.sin(a*7+.4)-25*Math.sin(a*13)-10*Math.sin(a*29);c.lineTo(x,y)}c.lineTo(P,H);c.fill()},3);
  BG.mid=strip('#2f3031',c=>{c.beginPath();c.moveTo(0,H);for(let x=0;x<=P;x+=16){const a=x/P*TAU;const y=520-55*Math.sin(a*4+2)-30*Math.sin(a*9+1)-14*Math.sin(a*21);c.lineTo(x,y)}c.lineTo(P,H);c.fill();
     [300,1100,1850].forEach((x,i)=>{pagoda(c,x,500-i*8,70+i*10,5-(i%2),'#262728');pagoda(c,x+P,500,70,5,'#262728');pagoda(c,x-P,500,70,5,'#262728')})},1.5);
  BG.near=strip('#161618',c=>{const rr=mulberry(5);let x=-100;while(x<P+100){const w=110+rr()*120,h=50+rr()*80;house(c,x+w/2,H-110+40,w,h,'#141416');house(c,x+w/2+P,H-110+40,w,h,'#141416');x+=w*.85;}
     [620,1500,2200].forEach(x=>{pagoda(c,x,H-60,60,4,'#121214');pagoda(c,x-P,H-60,60,4,'#121214');pagoda(c,x+P,H-60,60,4,'#121214')});
     c.fillRect(0,H-110,P,110)},0);
  BG.P=P;
  // paper grain
  const gr=mk(256,256),gc=gr.getContext('2d'),id=gc.createImageData(256,256);const nr=mulberry(3);for(let i=0;i<id.data.length;i+=4){const v=nr()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}gc.putImageData(id,0,0);BG.grain=ctx.createPattern(gr,'repeat');
  // vignette
  const vg=mk(W,H),vc=vg.getContext('2d');g=vc.createRadialGradient(W/2,H*.55,H*.35,W/2,H*.55,W*.72);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.72)');vc.fillStyle=g;vc.fillRect(0,0,W,H);BG.vig=vg;
}

function drawStrip(img,f,yoff,cam,alpha){const P=BG.P;let ox=-((cam.x*f)%P);if(ox>0)ox-=P;ctx.globalAlpha=alpha==null?1:alpha;const y=yoff-cam.y*f*.35;ctx.drawImage(img,ox,y);ctx.drawImage(img,ox+P,y);ctx.globalAlpha=1}

const PART=[],FX=[],SPLAT=[],DECAL=[],TXT=[];
function part(o){if(PART.length>900)PART.shift();PART.push(o)}
function inkBlobPts(r,seed){const rn=mulberry(seed|0),n=16,pts=[];for(let i=0;i<n;i++){const a=i/n*TAU,k=.55+rn()*.7;pts.push([Math.cos(a)*r*k,Math.sin(a)*r*k*(.8+rn()*.3)])}const sat=[];for(let i=0;i<6;i++){const a=rn()*TAU,d=r*(1+rn()*.9);sat.push([Math.cos(a)*d,Math.sin(a)*d,r*(.08+rn()*.18)])}return{pts,sat}}
function drawBlob(c,b,x,y,col,s){c.fillStyle=col;c.beginPath();for(let i=0;i<b.pts.length;i++){const p=b.pts[(i)%b.pts.length],q=b.pts[(i+1)%b.pts.length];const mx=(p[0]+q[0])/2*s,my=(p[1]+q[1])/2*s;if(i===0)c.moveTo(x+mx,y+my);else c.quadraticCurveTo(x+p[0]*s,y+p[1]*s,x+mx,y+my)}c.closePath();c.fill();for(const a of b.sat){c.beginPath();c.arc(x+a[0]*s,y+a[1]*s,a[2]*s,0,TAU);c.fill()}}
function screenSplat(x,y,r,col,life){SPLAT.push({x,y,r,col,life:life||1.6,max:life||1.6,b:inkBlobPts(r,Math.random()*1e6)})}
function decal(x,y,r,col){if(DECAL.length>50)DECAL.shift();DECAL.push({x,y,r,col,a:1,b:inkBlobPts(r,Math.random()*1e6)})}
function bloodBurst(x,y,dir,n,pow,black){for(let i=0;i<n;i++){const a=(dir>0?-.3:Math.PI+.3)+rand(-1.1,1.1)*(1);const s=rand(.3,1)*pow;part({t:'ink',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-rand(0,120),life:rand(.4,.9),max:.9,r:rand(2,6),col:(black&&Math.random()<.5)?'#0a0a0b':(Math.random()<.8?'#b3121a':'#d9d5cc'),g:900})}}
function sparkBurst(x,y,n,pow,col){for(let i=0;i<n;i++){const a=rand(0,TAU),s=rand(.3,1)*pow;part({t:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.15,.4),max:.4,r:rand(8,22),col:col||'#f4f0e6',g:300})}}
function ringFx(x,y,r,col,life,w){FX.push({k:'ring',x,y,r,col,life:life||.4,max:life||.4,w:w||3})}

function drawParticles(c,dt){
  for(let i=PART.length-1;i>=0;i--){const p=PART[i];p.life-=dt;if(p.life<=0){PART.splice(i,1);continue}
    p.vy+=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const k=p.life/p.max;
    if(p.t==='ink'){c.globalAlpha=Math.min(1,k*1.6);c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,p.r*(.5+k*.5),0,TAU);c.fill()}
    else if(p.t==='spark'){c.globalAlpha=k;c.strokeStyle=p.col;c.lineWidth=2;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*.03,p.y-p.vy*.03);c.stroke()}
    else if(p.t==='splash'){c.globalAlpha=k*.6;c.strokeStyle='#cfd2d0';c.lineWidth=1;c.beginPath();c.ellipse(p.x,p.y,p.r*(1-k)*2+1,p.r*(1-k)*.6+.5,0,0,TAU);c.stroke()}
    else if(p.t==='dust'){c.globalAlpha=k*.35;c.fillStyle='#aaa';c.beginPath();c.arc(p.x,p.y,p.r*(2-k),0,TAU);c.fill()}
    else if(p.t==='wisp'){c.globalAlpha=k*.7;c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,p.r*(1.4-k*.6),0,TAU);c.fill()}
  }c.globalAlpha=1}
function drawFX(c,dt){
  for(let i=FX.length-1;i>=0;i--){const f=FX[i];f.life-=dt;if(f.life<=0){FX.splice(i,1);continue}const k=f.life/f.max;
    if(f.k==='ring'){c.globalAlpha=k;c.strokeStyle=f.col;c.lineWidth=f.w*k+1;c.beginPath();c.arc(f.x,f.y,f.r*(1-k*k)+4,0,TAU);c.stroke()}
    else if(f.k==='slash'){c.save();c.translate(f.x,f.y);c.scale(f.face,1);const u=1-k;
      const a1=lerp(f.a0,f.a1,Math.min(1,u*2.6)),a0=lerp(f.a0,f.a1,Math.max(0,u*2.6-1.1));
      c.globalAlpha=k;c.lineCap='round';
      c.strokeStyle='rgba(180,15,22,.8)';c.lineWidth=14*k+2;c.beginPath();c.arc(0,0,f.r,Math.min(a0,a1),Math.max(a0,a1),a1<a0);c.stroke();
      c.strokeStyle=f.col;c.lineWidth=5*k+1;c.beginPath();c.arc(0,0,f.r*.97,Math.min(a0,a1),Math.max(a0,a1),a1<a0);c.stroke();c.restore()}
    else if(f.k==='line'){c.globalAlpha=k;c.strokeStyle=f.col;c.lineWidth=f.w*k;c.beginPath();c.moveTo(f.x,f.y);c.lineTo(f.x2,f.y2);c.stroke()}
  }c.globalAlpha=1}

function drawFigure(c,f){
  c.save();c.translate(f.x,f.y);if(f.rot)c.rotate(f.rot*f.face);c.scale(f.face*f.scale,f.scale);c.globalAlpha=f.alpha==null?1:f.alpha;c.lineCap='round';c.lineJoin='round';
  const lean=f.lean||0,cr=f.crouch||0,hipY=-46+cr,T=f.t||0;
  const hip=[lean*.3,hipY],sh=[lean,hipY-34],head=[lean*1.25+2,hipY-52];
  const armL=34,phi=f.armPhi==null?1:f.armPhi;
  const hand=[sh[0]+Math.cos(phi)*armL+(f.handPull||0),sh[1]+Math.sin(phi)*armL];
  function pass(extra,rim){
    const C=col=>rim?f.rim:col;
    // legs
    c.strokeStyle=C(f.leg||f.body);c.lineWidth=10+extra;
    for(let s=0;s<2;s++){let fx,fy;
      if(f.air){fx=s?14:-6;fy=s?-14:-6}
      else if(f.run){const ph=f.runPh+s*Math.PI;fx=Math.sin(ph)*22;fy=-Math.max(0,Math.cos(ph))*12}
      else{fx=s?11+(f.stance||0):-9-(f.stance||0)*.5;fy=0}
      if(f.wide){fx=s?30:-26}
      const kx=(hip[0]+fx)/2+5,ky=(hip[1]+fy)/2-3;
      c.beginPath();c.moveTo(hip[0],hip[1]);c.quadraticCurveTo(kx,ky,fx,fy);c.stroke()}
    // back arm
    c.lineWidth=7+extra;c.strokeStyle=C(f.body);c.beginPath();c.moveTo(sh[0]-2,sh[1]);c.quadraticCurveTo(sh[0]-12,sh[1]+14,sh[0]-6+(f.backArm||0),sh[1]+28);c.stroke();
    // robe / torso
    const fl=Math.sin(T*8)*3*(f.flow||0);
    c.fillStyle=C(f.body);c.beginPath();c.moveTo(sh[0]-12,sh[1]-2);c.lineTo(sh[0]+12,sh[1]-2);c.lineTo(hip[0]+16+fl,hip[1]+22);c.quadraticCurveTo(hip[0],hip[1]+30+fl,hip[0]-17-fl,hip[1]+22);c.closePath();c.fill();
    if(extra>0){c.lineWidth=extra;c.stroke()}
    // front arm
    c.lineWidth=8+extra;c.strokeStyle=C(f.body);const el=[(sh[0]+hand[0])/2,(sh[1]+hand[1])/2+5];c.beginPath();c.moveTo(sh[0],sh[1]);c.quadraticCurveTo(el[0],el[1],hand[0],hand[1]);c.stroke();
    // head
    if(f.hat){c.fillStyle=C(f.hat);c.beginPath();c.moveTo(head[0]-24,head[1]-2);c.quadraticCurveTo(head[0],head[1]-16,head[0],head[1]-26);c.quadraticCurveTo(head[0],head[1]-16,head[0]+24,head[1]-2);c.quadraticCurveTo(head[0],head[1]+4,head[0]-24,head[1]-2);c.fill();if(extra>0){c.lineWidth=extra;c.stroke()}
       c.fillStyle=C(f.body);c.beginPath();c.arc(head[0],head[1]+4,8,0,TAU);c.fill()}
    else{c.fillStyle=C(f.skin||'#d8d2c6');c.beginPath();c.arc(head[0],head[1],9.5,0,TAU);c.fill()}
  }
  // cape / scarf behind
  if(f.scarf&&!f.noScarf){c.strokeStyle=f.scarf;c.lineWidth=f.scarfW||6;c.beginPath();let px=sh[0]-6,py=sh[1]-4;c.moveTo(px,py);const sp=(f.speed||0)/340;for(let i=1;i<=7;i++){px-=7+sp*7;py+=Math.sin(T*10-i*.8)*3*(.4+sp)+(f.air?-1.8:1.2);c.lineTo(px,py)}c.stroke()}
  if(f.mantle){c.fillStyle=f.mantle;for(let i=0;i<7;i++){const a=-2.9+i*.32,r=f.mantleR||26;c.beginPath();c.moveTo(sh[0]+Math.cos(a+.3)*10,sh[1]+Math.sin(a+.3)*8);c.lineTo(sh[0]+Math.cos(a)*(r+ (i%2)*10),sh[1]-6+Math.sin(a)*(r+(i%2)*10)+Math.sin(T*6+i)*2);c.lineTo(sh[0]+Math.cos(a-.3)*10,sh[1]+Math.sin(a-.3)*8);c.fill()}}
  // weapon (behind rim? draw after body so it shows)
  pass(3.5,true);pass(0,false);
  // detail: hair / bun / mask band
  if(f.hair){c.strokeStyle=f.hair;c.lineWidth=5;c.beginPath();c.moveTo(head[0]-2,head[1]-6);let hx=head[0]-4,hy=head[1]-4;const sp=(f.speed||0)/340;for(let i=1;i<=6;i++){hx-=5+sp*6;hy+=Math.sin(T*9-i)*2.4+i*.6;c.lineTo(hx,hy)}c.stroke();c.fillStyle=f.hair;c.beginPath();c.arc(head[0]-1,head[1]-10,5,0,TAU);c.fill()}
  if(f.eye){c.fillStyle=f.eye;c.beginPath();c.arc(head[0]+5,head[1]+(f.hat?3:-1),2,0,TAU);c.fill();if(f.glow){c.shadowColor=f.eye;c.shadowBlur=10;c.fill();c.shadowBlur=0}}
  if(f.sash){c.strokeStyle=f.sash;c.lineWidth=5;c.beginPath();c.moveTo(hip[0]-14,hip[1]+2);c.lineTo(hip[0]+14,hip[1]-1);c.stroke()}
  if(f.shield){const sx=hand[0]+14,sy=hand[1]-18;c.fillStyle='#0d0d0f';c.strokeStyle='#d9d5cc';c.lineWidth=2.5;c.beginPath();c.ellipse(sx,sy,16,40,0,0,TAU);c.fill();c.stroke();c.fillStyle=f.glow?'#ff3030':'#9d1217';c.beginPath();c.arc(sx,sy,8,0,TAU);c.fill();c.strokeStyle='#d9d5cc';c.lineWidth=1.5;c.beginPath();c.moveTo(sx,sy-34);c.lineTo(sx,sy+34);c.stroke()}
  // blade
  if(f.weapon){const th=f.theta==null?-.3:f.theta,L=f.wlen||70;const bx=hand[0]+Math.cos(th)*L,by=hand[1]+Math.sin(th)*L;
    if(f.weapon==='spear'){c.strokeStyle='#2a2522';c.lineWidth=4;c.beginPath();c.moveTo(hand[0]-Math.cos(th)*60,hand[1]-Math.sin(th)*60);c.lineTo(bx,by);c.stroke();
      c.fillStyle='#e6e2da';c.beginPath();c.moveTo(bx,by);c.lineTo(bx-Math.cos(th)*26-Math.sin(th)*6,by-Math.sin(th)*26+Math.cos(th)*6);c.lineTo(bx-Math.cos(th)*26+Math.sin(th)*6,by-Math.sin(th)*26-Math.cos(th)*6);c.closePath();c.fill();
      c.fillStyle=f.glow?'#d11a22':'#9d1217';c.beginPath();c.arc(bx-Math.cos(th)*30,by-Math.sin(th)*30,4,0,TAU);c.fill()}
    else{const col=f.blade||'#e8e4da';
      if(f.glow){c.shadowColor='#ff2020';c.shadowBlur=16}
      c.strokeStyle='#050505';c.lineWidth=6;c.beginPath();c.moveTo(hand[0]-Math.cos(th)*10,hand[1]-Math.sin(th)*10);c.lineTo(bx,by);c.stroke();
      c.strokeStyle=f.glow?'#ff8f8f':col;c.lineWidth=3;c.beginPath();c.moveTo(hand[0]+Math.cos(th)*8,hand[1]+Math.sin(th)*8);c.lineTo(bx,by);c.stroke();c.shadowBlur=0;
      c.strokeStyle=f.hilt||'#7a0f14';c.lineWidth=5;c.beginPath();c.moveTo(hand[0]-Math.cos(th)*8,hand[1]-Math.sin(th)*8);c.lineTo(hand[0]+Math.cos(th)*8,hand[1]+Math.sin(th)*8);c.stroke()}}
  c.restore()}

/* ---------------- collision ---------------- */
function solid(p){return p.kind!=='awn'}
function moveCollide(o,dt,dropThrough){
  const pw=o.w/2;
  o.x+=o.vx*dt;o.hitWall=0;
  for(const p of PL){if(!solid(p))continue;if(o.y>p.y+3&&o.y-o.h<p.y+p.h){const l=o.x-pw,r=o.x+pw;if(r>p.x&&l<p.x+p.w){if(o.mantle&&o.y-p.y<=30&&o.vy>=-120&&!(p.kind==='pillar'&&false)){o.y=p.y;o.vy=0;o.onGround=true;o.plat=p;continue}if(o.x<p.x+p.w/2){o.x=p.x-pw;o.hitWall=1}else{o.x=p.x+p.w+pw;o.hitWall=-1}o.vx=0}}}
  const prevY=o.y;o.y+=o.vy*dt;o.onGround=false;
  for(const p of PL){const l=o.x-pw,r=o.x+pw;if(r<=p.x||l>=p.x+p.w)continue;
    if(o.vy>=0&&prevY<=p.y+4&&o.y>=p.y){if(p.kind==='awn'&&dropThrough)continue;o.y=p.y;o.vy=0;o.onGround=true;o.plat=p}
    else if(solid(p)&&o.vy<0&&o.y-o.h<p.y+p.h&&prevY-o.h>=p.y+p.h-6){o.y=p.y+p.h+o.h;o.vy=0}}
}
function wallTouch(o,dir){const x=o.x+dir*(o.w/2+3);for(const p of PL){if(!solid(p))continue;if(x>p.x&&x<p.x+p.w&&o.y-10>p.y&&o.y-o.h<p.y+p.h)return true}return false}

function playerTakeHit(src,a){
  const p=G.player;if(p.dead)return'none';
  if(p.act==='counter'||p.act==='exec')return'none';
  if(p.invuln>0){if(p.act==='dodge'&&p.dodgeI>0&&!src.dodgedFlag){src.dodgedFlag=true;perfectDodge(src)}return'dodge'}
  const front=(a.x>p.x)===(p.face>0);
  if(p.act==='parry'&&front&&!a.red){
    if(p.st<PW&&!p.parried){perfectParry(src,a);return'parry'}
    if(p.st>=PW&&p.guarding){ // block
      p.hp-=a.dmg*.12;p.posture+=a.post*1.15;p.vx=-p.face*240;p.parried=true;
      AU.clang(false);sparkBurst(p.x+p.face*30,p.y-62,12,380);ringFx(p.x+p.face*30,p.y-62,34,'#f4f0e6',.25,2);shake(3);hitstop(.04);
      if(p.hp<=0){killPlayer();return'hit'}
      if(p.posture>=p.maxPost)staggerPlayer();
      return'block'}}
  // clean hit
  let d=a.dmg*(p.act==='stagger'?1.4:1);p.hp-=d;p.posture=Math.min(p.maxPost,p.posture+a.post*.5);p.postT=0;p.act='hurt';p.st=0;p.dur=.3;p.hurtT=.3;p.invuln=.55;p.queued=false;p.charge=0;
  const dir=sgn(p.x-a.x);p.vx=dir*(a.red?460:300);p.vy=-170;p.onGround=false;p.face=-dir;
  bloodBurst(p.x,p.y-56,dir,16,360,true);decal(p.x,p.y,20,'#8e0f15');hitstop(.08);shake(a.red?12:7);AU.hit(!!a.red);screenSplat(p.x-G.cam.x+rand(-60,60),p.y-G.cam.y-60,70+d*3,'rgba(160,14,20,.8)',1.1);
  if(p.hp<=0)killPlayer();else if(p.posture>=p.maxPost)staggerPlayer();
  return'hit'}

function updateEnemy(e,dt){

     break;
   case'chase':{
     e.cd-=dt;const sp=e.cfg.speed*(isBoss&&e.ph===2?1.35:1);

         e.phase='act';e.t=0;e.hitDone=false;e.glow=!!s.red;

         if(s.proj){spawnProj(e,s.hi);sparkBurst(e.x+e.face*50,e.y-60,10,300,'#ff3a3a');AU.tone(200,.4,.2,'sawtooth',90,1)}
         else if(s.reach>0){const sy=e.y-(s.low?10:e.h*.55);slashFx(e.x,sy,e.face,Math.min(s.reach,150),s.low?.9:-2.4,s.low?-.1:1.0,s.red?'#ff5050':'#f4f0e6',.2)}
       }}
     else if(e.phase==='act'){
       if(s.lunge){e.vx=e.face*s.lunge*(1-e.t/(s.act||1)*.3)}
       if(!e.hitDone&&s.reach>0){const hr=enemyHitRect(e,s);if(p.act==='dodge'&&p.dodgeI>0&&!e.dodgedFlag){const pr=playerRect(p);if(ov({x1:hr.x1-70,x2:hr.x2+70,y1:hr.y1-30,y2:hr.y2+30},pr)){e.dodgedFlag=true;perfectDodge(e)}}if(ov(hr,playerRect(p))){const r=playerTakeHit(e,{dmg:s.dmg,post:s.post,red:s.red,x:e.x,src:e});if(r==='hit'||r==='block'||r==='parry')e.hitDone=true;if(r==='parry'){break}}}

function bossPick(e){

  else{add('bDash',4);if(ph===2){add('bWave2',3.2);add('bPhantom',2)}else add('bWave',2.2);add('bCrush',dist<330?1:0)}
  if(!opts.length)opts.push(['bCombo',1]);

function breakPosture(e){e.state='broken';e.t=0;e.atk=null;e.seq=null;e.glow=false;e.posture=e.maxPost;e.vis=true;popText('破',e.x,e.y-e.h-30,'#d9d5cc',60,1);AU.noise(.35,.5,'bandpass',900,300,2);AU.tone(260,.5,.2,'sawtooth',70);ringFx(e.x,e.y-e.h*.6,90,'#f4f0e6',.5,4);shake(5);hitstop(.1);sparkBurst(e.x,e.y-e.h*.6,20,500)}
function hurtEnemy(e,dmg,post,o){o=o||{};

    const hx=e.x+e.face*26,hy=e.y-56;

function execute(e,kind){

  AU.clang(true);AU.slash(true);flash(.55,'#fff');shake(12);hitstop(.18);setSlow(kind==='exec'?.9:.55,.2);G.zoomT=kind==='exec'?1.3:.7;
  e.invuln=false;

  if(boss&&kind==='exec'&&!e.dead&&e.state!=='transform'){e.state='hurt';e.t=0;e.hurtT=1.2;e.posture=0;e.vx=p.face*160}
  else if(boss&&kind==='exec'&&e.state==='transform'){}
  else if(!e.dead&&boss&&wasBroken){}

/* ---------------- main loop ---------------- */
function update(rdt){
  G.t+=rdt;
  G.nextLightning-=rdt;if(G.nextLightning<=0){G.lightning=1;G.nextLightning=rand(9,18);if(G.mode==='play')setTimeout(()=>AU.thunder(),rand(300,900))}
  G.lightning=Math.max(0,G.lightning-rdt*2.2);
  G.flash=Math.max(0,G.flash-rdt*1.8);G.shake=Math.max(0,G.shake-rdt*40);
  if(G.fade>0)G.fade=Math.max(0,G.fade-rdt*1.6);
  AU.tick(rdt);
  if(G.mode==='title'){G.cam.x=300+Math.sin(G.t*.1)*200;G.cam.y=0;G.dummy=true;if(consume('ok',.3)){G.mode='story';G.storyT=0}
    if(!G.player){G.enemies=[];G.boss=makeEnemy('boss',BOSS_X);G.player=newPlayer(CPS[0])}
    return}
  if(G.mode==='story'){G.storyT+=rdt;if(G.storyT>.5&&consume('ok',.3))startGame();return}
  if(G.ending){G.endT+=rdt;if(G.endT>3&&consume('ok',.3)){G.mode='title';G.player=null;G.ending=false;G.enemies=[];G.fade=1}
    if(G.endT<2.4){} }
  if(G.paused){if(keys.KeyR){G.paused=false;G.mode='title';G.player=null;G.enemies=[];G.fade=1}return}
  if(G.zoomT>0)G.zoomT-=rdt;G.zoom+=((G.zoomT>0?1.14:1)-G.zoom)*Math.min(1,rdt*8);
  let dt;
  if(G.hitstop>0){G.hitstop-=rdt;dt=0}else{if(G.slowT>0)G.slowT-=rdt;dt=rdt*G.ts}
  if(dt>0){const n=Math.max(1,Math.ceil(dt/.0125));for(let i=0;i<n;i++)worldUpdate(dt/n,rdt/n)}
  else{G.hintT-=0;}
  if(G.player.dead&&G.deathT>1.3&&consume('ok',.25)){respawn()}
  updateCamera(rdt,false);
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(VS,0,0,VS,VX,VY);ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  const rdt=G._rdt||.016;
  if(G.mode==='story'){drawStory()}
  else{
    ctx.save();if(G.zoom>1.001&&G.player){const px=G.player.x-G.cam.x,py=G.player.y-G.cam.y-60;ctx.translate(px,py);ctx.scale(G.zoom,G.zoom);ctx.translate(-px,-py)}
    drawScene(G.paused?0:(G.hitstop>0?0:rdt*(G.ts<1?.5:1)));ctx.restore();
    postFX();
    if(G.mode==='title')drawTitle();
    else{drawHUD();if(G.player&&G.player.dead)drawDeath();if(G.paused)drawPause();if(G.ending)drawWin()}
  }
  ctx.restore();
}
let lastT=performance.now();
function frame(now){const rdt=Math.min(.05,Math.max(.001,(now-lastT)/1000));lastT=now;G._rdt=rdt;
  try{tcFrame(rdt);update(rdt);render()}catch(e){console.error(e);window.__err=(window.__err||[]);window.__err.push(String(e&&e.stack||e));if(window.__err.length>5)window.__err.shift()}
  requestAnimationFrame(frame)}

/* ---------------- 触屏控制（手机 / 平板） ---------------- */
const TC={roles:new Map(),sid:null,sx:0,sy:0,kx:0,ky:0,vis:false,pm:false,rotOff:false,fsTried:false};
const TCR=60;
const TCK={atk:'KeyJ',heavy:'KeyI',parry:'KeyK',dodge:'KeyL',heal:'KeyQ',jump:'Space'};
const $e=id=>document.getElementById(id);
function tcKeyOn(c){if(!keys[c]){keys[c]=true;anyKeyAction(c)}}
function tcKeyOff(c){keys[c]=false}
function tcBtn(a,el,down){
  if(down)el.classList.add('down');else el.classList.remove('down');

function tcStickSet(x,y){

}

document.addEventListener('touchstart',e=>{
  if(!TOUCH){TOUCH=true;document.body.classList.add('touch');resize()}

function tcEnd(e){
  for(const t of e.changedTouches){

document.addEventListener('touchend',tcEnd,{passive:false});
document.addEventListener('touchcancel',tcEnd,{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&TOUCH&&G&&G.mode==='play')togglePause(true)});
// 轻触屏幕：标题 / 序章 / 死亡 / 结局 时等同回车（标题页的首次轻触同时尝试全屏）
document.addEventListener('pointerdown',e=>{
  if(!TOUCH||e.pointerType==='mouse')return;
  AU.init();
  if(G.mode==='title'){tcFullscreen();press.ok=performance.now()}
  else if(G.mode==='story')press.ok=performance.now();
  else if(G.ending||(G.player&&G.player.dead))press.ok=performance.now();
});
function tcFrame(dt){
  const play=TOUCH&&G&&G.mode==='play'&&!G.paused&&!G.ending&&!!G.player;
  if(play!==TC.vis){TC.vis=play;$e('tc').classList.toggle('on',play);if(!play)tcReleaseAll()}
  const pm=TOUCH&&G&&G.mode==='play'&&G.paused;
  if(pm!==TC.pm){TC.pm=pm;$e('pm').classList.toggle('on',pm);if(pm)$e('pm').querySelector('[data-m=mute]').textContent=AU.muted?'开启声音':'静音'}

  $e('rot').style.display=rot?'block':'none';
}
